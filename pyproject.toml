[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fist-llm-kb"
version = "0.2.2"
description = "Inspectable, file-based knowledge for AI agents, with a CLI and local MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fist"}]
keywords = ["agents", "knowledge-base", "memory", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = ["mcp>=1.27,<2"]

[project.optional-dependencies]
pdf = ["pypdf>=5,<7"]

[project.scripts]
fist-kb = "fist_kb.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fist_kb"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/examples", "/skills", "/.agents", "/.claude-plugin", "/.codex-plugin", "/plugin.json", "/mcp.json", "/.gitignore", "/.gitattributes", "/README.md", "/LICENSE", "/CHANGELOG.md", "/PROVENANCE.json", "/pyproject.toml", "/uv.lock"]

